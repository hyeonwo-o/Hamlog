name: Docker Deploy

concurrency:
  group: docker-deploy-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      
      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Verify data integrity
        run: npm run verify:data

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E Test
        run: npm run test:e2e
      
      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
          
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test Docker runtime
        run: |
          IMAGE_TAG=$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | tail -n 1)
          bash scripts/smoke-docker.sh "$IMAGE_TAG"

      - name: Push Docker image
        if: github.event_name != 'pull_request'
        run: |
          while IFS= read -r image_tag; do
            [ -n "$image_tag" ] || continue
            docker push "$image_tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  deploy:
    needs: build-and-push
    runs-on: [self-hosted, blog]
    if: github.ref == 'refs/heads/main'
    environment: production
    permissions:
      contents: read
      packages: read
    
    steps:
      - uses: actions/checkout@v5

      - name: Cleanup self-hosted runner logs
        run: |
          set -euo pipefail

          if [ -n "${RUNNER_TEMP:-}" ]; then
            RUNNER_ROOT="$(cd "${RUNNER_TEMP}/../.." && pwd)"
            if [ -d "${RUNNER_ROOT}/_diag" ]; then
              find "${RUNNER_ROOT}/_diag" -type f -mtime +7 -delete || true
            fi
          fi

      - name: Backup persistent data
        env:
          BACKUP_RETENTION_DAYS: '30'
          HAMLOG_CONTAINER_NAME: hamlog
          HAMLOG_VERIFY_DATA: 'true'
          HAMLOG_BACKUP_HOOK: ${{ vars.HAMLOG_BACKUP_HOOK }}
        run: bash scripts/backup-data.sh "$HOME/hamlog-data" "$HOME/hamlog-backups"

      - name: Deploy to Server
        env:
          GITHUB_SHA: ${{ github.sha }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          COOKIE_SAME_SITE: ${{ secrets.COOKIE_SAME_SITE }}
          COOKIE_SECURE: ${{ secrets.COOKIE_SECURE }}
          TRUST_PROXY: ${{ secrets.TRUST_PROXY }}
          SITE_URL: ${{ secrets.SITE_URL }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
          NAVER_SITE_VERIFICATION: ${{ secrets.NAVER_SITE_VERIFICATION }}
          DAUM_SITE_VERIFICATION: ${{ secrets.DAUM_SITE_VERIFICATION }}
          DAUM_WEBMASTER_PIN: ${{ secrets.DAUM_WEBMASTER_PIN }}
          HAMLOG_BIND_ADDRESS: ${{ vars.HAMLOG_BIND_ADDRESS }}
        run: |
          set -euo pipefail

          : "${JWT_SECRET:?JWT_SECRET secret is required}"
          : "${ADMIN_PASSWORD:?ADMIN_PASSWORD secret is required}"

          # Convert repository name to lowercase
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_REPO="ghcr.io/$REPO"
          IMAGE_TAG="ghcr.io/$REPO:sha-${GITHUB_SHA::7}"
          APP_VERSION="${GITHUB_SHA::7}"
          HAMLOG_BIND_ADDRESS="${HAMLOG_BIND_ADDRESS:-127.0.0.1}"
          PUBLISH_BIND_ADDRESS="$HAMLOG_BIND_ADDRESS"
          LOCAL_HEALTH_ADDRESS="$HAMLOG_BIND_ADDRESS"
          DATA_GID="$(id -g)"
          ROLLBACK_CONTAINER="hamlog-rollback-${GITHUB_RUN_ID:-manual}-${GITHUB_RUN_ATTEMPT:-1}"
          PREVIOUS_IMAGE=""
          PREVIOUS_IMAGE_ID=""
          PREVIOUS_CONTAINER_EXISTS=false
          PREVIOUS_CONTAINER_PRESERVED=false
          PREVIOUS_CONTAINER_STOPPED=false
          DEPLOYMENT_COMMITTED=false

          if docker inspect hamlog >/dev/null 2>&1; then
            PREVIOUS_IMAGE=$(docker inspect --format='{{.Config.Image}}' hamlog)
            PREVIOUS_IMAGE_ID=$(docker inspect --format='{{.Image}}' hamlog)
            PREVIOUS_CONTAINER_EXISTS=true
          fi

          if [[ "$PUBLISH_BIND_ADDRESS" == *:* ]]; then
            PUBLISH_BIND_ADDRESS="[$PUBLISH_BIND_ADDRESS]"
          fi

          case "$LOCAL_HEALTH_ADDRESS" in
            0.0.0.0) LOCAL_HEALTH_ADDRESS="127.0.0.1" ;;
            ::) LOCAL_HEALTH_ADDRESS="::1" ;;
          esac

          if [[ "$LOCAL_HEALTH_ADDRESS" == *:* ]]; then
            LOCAL_HEALTH_ADDRESS="[$LOCAL_HEALTH_ADDRESS]"
          fi

          LOCAL_HEALTH_URL="http://$LOCAL_HEALTH_ADDRESS:4000"

          if [ "$HAMLOG_BIND_ADDRESS" != "127.0.0.1" ] && [ "$HAMLOG_BIND_ADDRESS" != "::1" ]; then
            echo "WARNING: exposing the production container on $HAMLOG_BIND_ADDRESS:4000"
          fi
          
          echo "Deploying $IMAGE_TAG..."

          # Login to GHCR
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

          cleanup_old_repo_images() {
            docker image ls "$IMAGE_REPO" --format '{{.Repository}}:{{.Tag}}' | while read -r image_ref; do
              [ -n "$image_ref" ] || continue

              if [ "$image_ref" = "$IMAGE_TAG" ] || [ "$image_ref" = "$PREVIOUS_IMAGE" ]; then
                continue
              fi

              docker image rm -f "$image_ref" >/dev/null 2>&1 || true
            done
          }

          # Free room before pulling the next release image.
          cleanup_old_repo_images

          # Pull latest image
          docker pull "$IMAGE_TAG"

          prepare_persistent_directories() {
            local image="$1"
            local runtime_user
            local data_owner
            runtime_user=$(docker image inspect --format='{{.Config.User}}' "$image")

            case "$runtime_user" in
              ''|root|0|0:0|root:root) data_owner='root' ;;
              node|node:node|1000|1000:1000) data_owner='node' ;;
              *)
                echo "Unsupported container runtime user for persistent data: $runtime_user" >&2
                return 1
                ;;
            esac

            mkdir -p "$HOME/hamlog-data/data" "$HOME/hamlog-data/uploads"
            docker run --rm \
              --user root \
              --network none \
              --cap-drop ALL \
              --cap-add CHOWN \
              --cap-add DAC_OVERRIDE \
              --cap-add FOWNER \
              --cap-add FSETID \
              --security-opt no-new-privileges \
              --entrypoint sh \
              -v "$HOME/hamlog-data/data:/app/server/data" \
              -v "$HOME/hamlog-data/uploads:/app/server/uploads" \
              "$image" \
              -c 'set -e
                  chown -R "$1:$2" /app/server/data /app/server/uploads
                  chmod -R u=rwX,g=rX,o= /app/server/data /app/server/uploads
                  find /app/server/data /app/server/uploads -type d -exec chmod g+s {} +' \
              sh "$data_owner" "$DATA_GID"
          }

          run_container() {
            local image="$1"
            local app_version="${2:-}"
            docker run -d \
              --name hamlog \
              --restart unless-stopped \
              --log-driver json-file \
              --log-opt max-size=10m \
              --log-opt max-file=3 \
              --cap-drop ALL \
              --security-opt no-new-privileges \
              -p "$PUBLISH_BIND_ADDRESS:4000:4000" \
              -v "$HOME/hamlog-data/data:/app/server/data" \
              -v "$HOME/hamlog-data/uploads:/app/server/uploads" \
              -e NODE_ENV=production \
              -e PORT=4000 \
              -e APP_VERSION="$app_version" \
              -e JWT_SECRET="$JWT_SECRET" \
              -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
              -e CORS_ORIGINS="$CORS_ORIGINS" \
              -e COOKIE_SAME_SITE="$COOKIE_SAME_SITE" \
              -e COOKIE_SECURE="$COOKIE_SECURE" \
              -e TRUST_PROXY="$TRUST_PROXY" \
              -e SITE_URL="$SITE_URL" \
              -e GOOGLE_SITE_VERIFICATION="$GOOGLE_SITE_VERIFICATION" \
              -e NAVER_SITE_VERIFICATION="$NAVER_SITE_VERIFICATION" \
              -e DAUM_SITE_VERIFICATION="$DAUM_SITE_VERIFICATION" \
              -e DAUM_WEBMASTER_PIN="$DAUM_WEBMASTER_PIN" \
              "$image"
          }

          wait_for_health() {
            local health_url="$1"
            local expected_version="${2:-}"
            local attempt=0
            while [ "$attempt" -lt 15 ]; do
              local response
              response=$(curl -fsS --max-time 5 "$health_url" 2>/dev/null || true)

              if [[ "$response" == *'"status":"ok"'* ]]; then
                if [ -z "$expected_version" ] || [[ "$response" == *"\"version\":\"$expected_version\""* ]]; then
                  return 0
                fi
              fi

              attempt=$((attempt + 1))
              sleep 2
            done
            return 1
          }

          wait_for_deployment_health() {
            local expected_version="${1:-}"

            wait_for_health "$LOCAL_HEALTH_URL/api/health" "$expected_version" || return 1
            verify_persistent_writes || return 1

            if [ -z "${SITE_URL:-}" ]; then
              echo "SITE_URL is not configured; public health check skipped."
              return 0
            fi

            wait_for_health "${SITE_URL%/}/api/health" "$expected_version" || return 1
            curl -fsS --max-time 10 "${SITE_URL%/}/" >/dev/null
          }

          wait_for_container_health() {
            local attempt=0
            while [ "$attempt" -lt 15 ]; do
              if docker exec hamlog node -e \
                "fetch('http://127.0.0.1:4000/api/health').then(async (response) => { const body = await response.json(); if (!response.ok || body.status !== 'ok') process.exit(1); }).catch(() => process.exit(1))"; then
                return 0
              fi
              attempt=$((attempt + 1))
              sleep 2
            done
            return 1
          }

          verify_persistent_writes() {
            docker exec hamlog node -e \
              "const fs = require('node:fs'); const created = []; try { for (const dir of ['/app/server/data', '/app/server/uploads']) created.push(fs.mkdtempSync(dir + '/.hamlog-write-check-')); } finally { for (const path of created.reverse()) fs.rmSync(path, { recursive: true, force: true }); }"
          }

          preserve_previous_container() {
            if [ "$PREVIOUS_CONTAINER_EXISTS" != true ]; then
              return 0
            fi

            if docker inspect "$ROLLBACK_CONTAINER" >/dev/null 2>&1; then
              echo "Rollback container name already exists: $ROLLBACK_CONTAINER" >&2
              return 1
            fi

            # Arm restoration before stop so an interrupt during `docker stop`
            # still restarts the container under its original name.
            PREVIOUS_CONTAINER_STOPPED=true
            docker stop hamlog || return 1
            if ! docker rename hamlog "$ROLLBACK_CONTAINER"; then
              if docker start hamlog; then
                PREVIOUS_CONTAINER_STOPPED=false
              fi
              return 1
            fi

            PREVIOUS_CONTAINER_PRESERVED=true
          }

          rollback_to_previous() {
            if [ "$PREVIOUS_CONTAINER_PRESERVED" != true ]; then
              echo "No preserved container is available for rollback." >&2
              return 1
            fi

            echo "Restoring preserved container from $PREVIOUS_IMAGE"
            prepare_persistent_directories "$PREVIOUS_IMAGE_ID" || return 1
            docker rename "$ROLLBACK_CONTAINER" hamlog || return 1
            # The previous container is now back under its canonical name. From
            # this point an exit handler must start it, not remove it as the new one.
            PREVIOUS_CONTAINER_PRESERVED=false
            docker start hamlog || return 1

            if ! wait_for_container_health || ! verify_persistent_writes; then
              echo "Rollback health check failed." >&2
              docker logs hamlog || true
              return 1
            fi

            PREVIOUS_CONTAINER_STOPPED=false
          }

          restore_interrupted_cutover() {
            local exit_code=$?
            local rollback_container_exists=false
            local canonical_image_id=""
            local canonical_is_previous=false

            # Avoid recursive traps and let the recovery attempt finish when the
            # runner sends more graceful termination signals.
            trap - EXIT
            trap '' HUP INT TERM

            if [ "$DEPLOYMENT_COMMITTED" != true ]; then
              # A signal may arrive after `docker rename` succeeds but before the
              # next shell assignment. Reconcile actual Docker names/image IDs so
              # that the preserved container is never mistaken for the new one.
              if [ "$PREVIOUS_CONTAINER_STOPPED" = true ] \
                || [ "$PREVIOUS_CONTAINER_PRESERVED" = true ]; then
                if docker inspect "$ROLLBACK_CONTAINER" >/dev/null 2>&1; then
                  rollback_container_exists=true
                fi
                canonical_image_id=$(docker inspect --format='{{.Image}}' hamlog 2>/dev/null || true)
                if [ -n "$PREVIOUS_IMAGE_ID" ] && [ "$canonical_image_id" = "$PREVIOUS_IMAGE_ID" ]; then
                  canonical_is_previous=true
                fi
              fi

              if [ "$rollback_container_exists" = true ]; then
                echo "Deployment interrupted; restoring the preserved container." >&2
                PREVIOUS_CONTAINER_PRESERVED=true
                docker rm -f hamlog >/dev/null 2>&1 || true
                if ! rollback_to_previous; then
                  echo "Interrupted deployment rollback failed; $ROLLBACK_CONTAINER remains for manual recovery when available." >&2
                fi
              elif [ "$canonical_is_previous" = true ]; then
                echo "Deployment interrupted while the previous container was stopped; restarting it." >&2
                PREVIOUS_CONTAINER_PRESERVED=false
                if docker start hamlog >/dev/null 2>&1 \
                  && wait_for_container_health \
                  && verify_persistent_writes; then
                  PREVIOUS_CONTAINER_STOPPED=false
                else
                  echo "Could not confirm recovery of the previous hamlog container." >&2
                  docker logs hamlog || true
                fi
              elif [ "$PREVIOUS_CONTAINER_STOPPED" = true ] \
                || [ "$PREVIOUS_CONTAINER_PRESERVED" = true ]; then
                echo "Could not locate the previous container under hamlog or $ROLLBACK_CONTAINER; leaving any current container untouched." >&2
              fi
            fi

            exit "$exit_code"
          }

          # Only arm the recovery handler immediately before the destructive
          # cutover. Failures during image pull/preparation leave production intact.
          trap restore_interrupted_cutover EXIT
          trap 'exit 129' HUP
          trap 'exit 130' INT
          trap 'exit 143' TERM

          if ! preserve_previous_container; then
            echo "Could not preserve the current container; deployment aborted before cutover." >&2
            exit 1
          fi

          if ! prepare_persistent_directories "$IMAGE_TAG" \
            || ! run_container "$IMAGE_TAG" "$APP_VERSION" \
            || ! wait_for_deployment_health "$APP_VERSION"; then
            echo "New deployment failed during preparation, startup, or verification."
            docker logs hamlog || true
            docker rm -f hamlog || true

            if ! rollback_to_previous; then
              echo "Automatic rollback did not restore a healthy writable container." >&2
            fi

            exit 1
          fi

          # The new container is healthy and writable. Disable automatic rollback
          # before deleting the preserved container so an interrupt cannot remove
          # the healthy release after its rollback source has gone away.
          DEPLOYMENT_COMMITTED=true
          trap - EXIT HUP INT TERM

          if [ "$PREVIOUS_CONTAINER_PRESERVED" = true ]; then
            docker rm "$ROLLBACK_CONTAINER" >/dev/null
            PREVIOUS_CONTAINER_PRESERVED=false
            PREVIOUS_CONTAINER_STOPPED=false
          fi

          # Cleanup previous release images that are no longer needed on the runner.
          cleanup_old_repo_images
          docker builder prune --filter "until=168h" -f >/dev/null 2>&1 || true

      - name: Send Telegram Notification
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Deployment Successful!*
          
          Runner: blog
          Commit: ${{ github.sha }}
          New version is live on HamLog." \
          -d parse_mode="Markdown"

      - name: Send Failure Notification
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Deployment Failed!*
          
          Runner: blog
          Commit: ${{ github.sha }}
          Please check GitHub Actions for details." \
          -d parse_mode="Markdown"
