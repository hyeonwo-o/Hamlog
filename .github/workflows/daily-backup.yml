name: Daily Production Backup

on:
  schedule:
    # 03:17 Asia/Seoul. A non-round minute reduces public scheduler congestion.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  # Share the production deployment group so backup and cutover never overlap.
  group: docker-deploy-refs/heads/main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: [self-hosted, blog]
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - name: Create and verify local backup
        env:
          BACKUP_RETENTION_DAYS: '30'
          HAMLOG_CONTAINER_NAME: hamlog
          HAMLOG_VERIFY_DATA: 'true'
          HAMLOG_BACKUP_HOOK: ${{ vars.HAMLOG_BACKUP_HOOK }}
        run: bash scripts/backup-data.sh "$HOME/hamlog-data" "$HOME/hamlog-backups"

      - name: Send backup failure notification
        if: failure()
        run: |
          curl -fsS -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="❌ HamLog daily backup failed. Check GitHub Actions run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
